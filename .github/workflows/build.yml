name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 默认会尝试装 'tools' 包，该包已从 sdkmanager 仓库移除，
        # 会导致整步 exit 1。显式指定需要的包，避免抓不存在的 'tools'。
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        log-accepted-android-sdk-licenses: false

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # 用仓库内的固定 keystore 签名。
    # 默认 debug keystore 由各 runner 临时生成，导致每次构建签名不同、
    # 无法覆盖安装（Conflicting app signatures）。
    # 固定签名后 adb install -r 可直接覆盖且保留数据。
    - name: Configure fixed signing key
      run: |
        mkdir -p keystore
        # .p12 已在仓库中（debug 用途，无安全风险）

    - name: Build debug APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace \
          -Pdavmusic.storeFile=keystore/davmusic.p12 \
          -Pdavmusic.storePassword=davmusic2026 \
          -Pdavmusic.keyAlias=davmusic \
          -Pdavmusic.keyPassword=davmusic2026

    - name: List APK output
      run: find . -name "*.apk" -type f

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: davmusic-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
