plugins {
    id 'com.android.application'
}

android {
    namespace 'com.byron.davmusic'
    compileSdk 34

    defaultConfig {
        applicationId "com.byron.davmusic"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 固定签名配置。
    // 默认 debug keystore 由每个 CI runner 临时生成，各次构建签名不同，
    // 会导致 "Conflicting app signatures" 无法覆盖安装。
    // 这里改用仓库内固定的 keystore（debug 用途，无安全风险），
    // 使每次构建签名一致，支持 adb install -r 覆盖安装并保留数据。
    // 参数由 CI 通过 -P 传入；本地构建若未传入则回退到默认 debug 签名。
    signingConfigs {
        if (project.hasProperty('davmusic.storeFile')) {
            fixed {
                // 注意：app 模块中的 file() 以 app/ 为基准解析，
                // 而 keystore 位于仓库根目录，必须用 rootProject.file()
                storeFile rootProject.file(project.property('davmusic.storeFile'))
                storePassword project.property('davmusic.storePassword')
                keyAlias project.property('davmusic.keyAlias')
                keyPassword project.property('davmusic.keyPassword')
                // PKCS12 的 store/key 密码必须一致
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (project.hasProperty('davmusic.storeFile')) {
                signingConfig signingConfigs.fixed
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 下拉刷新（独立库，不被 material/constraintlayout 传递引入）
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // RecyclerView 列表
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // 网络库 - WebDAV 通信 (PROPFIND/GET/PUT)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
